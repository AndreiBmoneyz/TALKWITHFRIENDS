<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendsTalking</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0f0f13;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#fff; min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:20px; padding:24px;
}
h1 { font-size:28px; font-weight:700; }
h1 span { color:#5865F2; }
.subtitle { color:rgba(255,255,255,0.4); font-size:14px; }
.card {
  background:#17171f; border:1px solid rgba(255,255,255,0.07);
  border-radius:16px; padding:28px; width:100%; max-width:400px;
  display:flex; flex-direction:column; gap:14px;
}
.tabs { display:flex; gap:8px; }
.tab {
  flex:1; padding:9px; border-radius:8px; border:none;
  font-size:13px; font-weight:600; cursor:pointer;
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4);
  transition:all 0.15s;
}
.tab.active { background:#5865F2; color:#fff; }
input {
  background:#0f0f13; border:1px solid rgba(255,255,255,0.1);
  border-radius:10px; padding:12px 16px; color:#fff;
  font-size:14px; outline:none; width:100%;
}
input:focus { border-color:#5865F2; }
input::placeholder { color:rgba(255,255,255,0.25); }
.btn {
  padding:13px; border-radius:10px; border:none;
  font-size:15px; font-weight:600; cursor:pointer; width:100%;
  transition:opacity 0.15s, transform 0.1s;
}
.btn:active { transform:scale(0.98); }
.btn:hover:not(:disabled) { opacity:0.88; }
.btn:disabled { opacity:0.35; cursor:not-allowed; }
.btn-primary { background:#5865F2; color:#fff; }
.btn-danger { background:rgba(226,75,74,0.15); color:#E24B4A; border:1px solid rgba(226,75,74,0.25); }
.err { font-size:12px; color:#E24B4A; text-align:center; min-height:16px; }
#appScreen { display:none; flex-direction:column; align-items:center; gap:20px; width:100%; max-width:440px; }
.user-bar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:#17171f; border:1px solid rgba(255,255,255,0.07);
  border-radius:12px; padding:10px 16px;
}
.user-info { display:flex; align-items:center; gap:10px; }
.user-initial {
  width:36px; height:36px; border-radius:50%; background:#5865F2;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px;
}
.user-name { font-size:14px; font-weight:500; }
.logout-btn { background:none; border:none; color:rgba(255,255,255,0.3); font-size:12px; cursor:pointer; }
.logout-btn:hover { color:rgba(255,255,255,0.6); }
#voiceRoom {
  display:none; flex-direction:column; align-items:center; gap:20px;
  width:100%; max-width:800px;
}
.room-title { font-size:16px; color:#1D9E75; font-weight:600; }
.room-count { font-size:12px; color:rgba(255,255,255,0.3); }
.campfire-scene {
  position:relative; width:100%; aspect-ratio:4095/2276;
  background:url('/campfire.png') center/cover no-repeat;
  border-radius:16px; overflow:hidden;
}
.participant {
  position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px;
  transform:translate(-50%, -50%);
}
.participant:nth-child(1) { left: 26.6%; top: 45.0%; } /* size: 65px */
.participant:nth-child(2) { left: 39.5%; top: 36.0%; } /* size: 65px */
.participant:nth-child(3) { left: 53.3%; top: 30.5%; } /* size: 65px */
.participant:nth-child(4) { left: 68.5%; top: 38.0%; } /* size: 65px */
.participant:nth-child(5) { left: 80.6%; top: 47.5%; } /* size: 65px */
.p-avatar {
  width:72px; height:72px; border-radius:50%; background:#1a2a4a;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:700; color:#85b7eb;
  border:3px solid rgba(255,255,255,0.1);
  transition:border-color 0.2s, box-shadow 0.2s;
}
.p-avatar.speaking { border-color:#1D9E75; box-shadow:0 0 18px rgba(29,158,117,0.5); }
.p-name { font-size:11px; color:rgba(255,255,255,0.45); }
.mic-bar {
  display:flex; align-items:center; gap:12px;
  background:#17171f; border:1px solid rgba(255,255,255,0.07);
  border-radius:12px; padding:12px 24px;
}
.mic-btn {
  width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
  font-size:22px; transition:all 0.15s; background:#1D9E75;
}
.mic-btn.muted { background:rgba(226,75,74,0.25); }
.mic-label { font-size:12px; color:rgba(255,255,255,0.3); }
</style>
</head>
<body>

<h1>Friends<span>Talking</span></h1>
<p class="subtitle">Meet random people. Just talk.</p>

<div id="authScreen">
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab" id="registerTab" onclick="switchTab('register')">Sign up</button>
    </div>
    <input type="text" id="authUsername" placeholder="Username" maxlength="32"/>
    <input type="password" id="authPassword" placeholder="Password"/>
    <div class="err" id="authErr"></div>
    <button class="btn btn-primary" id="authBtn" onclick="doAuth()">Login</button>
  </div>
</div>

<div id="appScreen">
  <div class="user-bar">
    <div class="user-info">
      <div class="user-initial" id="userInitial">?</div>
      <span class="user-name" id="userName"></span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
  <div class="card">
    <button class="btn btn-primary" id="connectBtn" onclick="joinRoom()">Connect with strangers</button>
  </div>
</div>

<div id="voiceRoom">
  <div class="room-title">🎙 Room active</div>
  <div class="room-count" id="roomCount"></div>
  <div class="campfire-scene" id="participants"></div>
  <div class="mic-bar">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <span class="mic-label" id="micLabel">Mic on</span>
  </div>
  <button class="btn btn-danger" style="max-width:300px" onclick="leaveRoom()">Leave room</button>
  <button class="btn btn-primary" style="max-width:300px" onclick="nextRoom()">Next room →</button>
</div>

<script>
let currentUser = null;
let currentTab = 'login';
let livekitRoom = null;
let micMuted = false;
let currentRoomName = null;

async function init() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (data.user) showApp(data.user);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
  document.getElementById('authBtn').textContent = tab === 'login' ? 'Login' : 'Create account';
  document.getElementById('authErr').textContent = '';
}

async function doAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'Fill in all fields'; return; }
  const endpoint = currentTab === 'login' ? '/api/login' : '/api/register';
  try {
    const res = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.error) { errEl.textContent = data.error; return; }
    showApp(data.user);
  } catch(e) { errEl.textContent = 'Connection error'; }
}

async function doLogout() {
  if (livekitRoom) { await livekitRoom.disconnect(); livekitRoom = null; }
  await fetch('/api/logout', { method: 'POST' });
  currentUser = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('voiceRoom').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

function showApp(user) {
  currentUser = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('userName').textContent = user.username;
  document.getElementById('userInitial').textContent = user.username[0].toUpperCase();
}

async function joinRoom() {
  document.getElementById('connectBtn').disabled = true;
  document.getElementById('connectBtn').textContent = 'Connecting...';
  try {
    const res = await fetch('/api/join', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const data = await res.json();
    if (data.ok) await startVoice(data);
  } catch(e) {
    console.error(e);
  }
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('connectBtn').textContent = 'Connect with strangers';
}

async function nextRoom() {
  // Leave current room then join a new one
  if (livekitRoom) { await livekitRoom.disconnect(); livekitRoom = null; }
  await fetch('/api/leave', { method: 'POST' }).catch(() => {});
  currentRoomName = null;
  // Join a new room
  try {
    const res = await fetch('/api/join', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const data = await res.json();
    if (data.ok) await startVoice(data);
  } catch(e) { console.error(e); }
}

async function startVoice(data) {
  currentRoomName = data.roomName;
  micMuted = false;
  document.getElementById('micBtn').textContent = '🎤';
  document.getElementById('micBtn').className = 'mic-btn';
  document.getElementById('micLabel').textContent = 'Mic on';

  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('voiceRoom').style.display = 'flex';
  renderParticipants(data.roomUsers);
  document.getElementById('roomCount').textContent = `${data.roomUsers.length} / ${5} people`;

  try {
    livekitRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    livekitRoom.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      document.querySelectorAll('.p-avatar').forEach(el => el.classList.remove('speaking'));
      speakers.forEach(s => {
        const el = document.getElementById('p-' + s.identity);
        if (el) el.classList.add('speaking');
      });
    });
    livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => {
      document.getElementById('roomCount').textContent = `${livekitRoom.remoteParticipants.size + 1} / 5 people`;
    });
    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      if (track.kind === 'audio') {
        const audioEl = track.attach();
        document.body.appendChild(audioEl);
      }
    });
    await livekitRoom.connect(data.livekitUrl, data.token);
    await livekitRoom.localParticipant.setMicrophoneEnabled(true);
    console.log('Connected to room:', data.roomName);
  } catch(e) {
    console.error('Livekit error:', e);
  }
}

function renderParticipants(users) {
  document.getElementById('participants').innerHTML = users.map(u => `
    <div class="participant">
      ${u.id !== currentUser.id ? `<button onclick="muteParticipant('${u.id}', this)" style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;">🔊</button>
      <input type="range" min="0" max="200" value="200" style="width:70px;accent-color:#5865F2;" oninput="setVolume('${u.id}', this.value)"/>` : ''}
      <div class="p-avatar" id="p-${u.id}">${u.username[0].toUpperCase()}</div>
      <div class="p-name" style="background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:4px;">${u.username}</div>
    </div>
  `).join('');
}

function toggleMic() {
  micMuted = !micMuted;
  document.getElementById('micBtn').textContent = micMuted ? '🔇' : '🎤';
  document.getElementById('micBtn').className = 'mic-btn' + (micMuted ? ' muted' : '');
  document.getElementById('micLabel').textContent = micMuted ? 'Mic off' : 'Mic on';
  if (livekitRoom && livekitRoom.localParticipant) {
    livekitRoom.localParticipant.setMicrophoneEnabled(!micMuted).catch(e => console.error('Mic error:', e));
  }
}

async function leaveRoom() {
  if (livekitRoom) { await livekitRoom.disconnect(); livekitRoom = null; }
  await fetch('/api/leave', { method: 'POST' }).catch(() => {});
  currentRoomName = null;
  document.getElementById('voiceRoom').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
}

function setVolume(userId, value) {
  if (!livekitRoom) return;
  livekitRoom.remoteParticipants.forEach((participant) => {
    if (participant.identity === String(userId)) {
      participant.audioTrackPublications.forEach((pub) => {
        if (pub.track) {
          const audioEl = pub.track.attachedElements[0];
          if (audioEl) audioEl.volume = value / 200;
        }
      });
    }
  });
}  

function muteParticipant(userId, btn) {
  if (!livekitRoom) return;
  livekitRoom.remoteParticipants.forEach((participant) => {
    if (participant.identity === String(userId)) {
      participant.audioTrackPublications.forEach((pub) => {
        if (pub.track) {
          const audioEl = pub.track.attachedElements[0];
          if (audioEl) {
            audioEl.muted = !audioEl.muted;
            btn.textContent = audioEl.muted ? '🔇' : '🔊';
          }
        }
      });
    }
  });
}
  
init();
</script>
</body>
</html>
